name: HowlIOS
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  HowlIOS:
    type: application
    platform: iOS
    sources:
      - path: HowlCore/Sources
      - path: HowlIOS/Sources
      - path: HowlIOS/Resources
    dependencies:
      - sdk: CoreBluetooth.framework
    info:
      path: HowlIOS/Info.plist
      properties:
        CFBundleDisplayName: Howl
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Howl HWL Script
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - com.markmcginley.howl.hwl
          - CFBundleTypeName: Funscript
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - com.markmcginley.howl.funscript
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSBluetoothAlwaysUsageDescription: Howl uses Bluetooth to discover and connect to compatible devices.
        NSBluetoothPeripheralUsageDescription: Howl uses Bluetooth to discover and connect to compatible devices.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.markmcginley.howl.hwl
            UTTypeDescription: Howl HWL File
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - hwl
          - UTTypeIdentifier: com.markmcginley.howl.funscript
            UTTypeDescription: Funscript File
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - funscript
        UIBackgroundModes:
          - bluetooth-central
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.amethystsysadmin.howl.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        VERSIONING_SYSTEM: apple-generic
