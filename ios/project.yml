name: HowlIOS
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  HowlIOS:
    type: application
    platform: iOS
    sources:
      - path: HowlCore/Sources
      - path: HowlIOS/Sources
      - path: HowlIOS/Resources
    dependencies:
      - sdk: CoreBluetooth.framework
    info:
      path: HowlIOS/Info.plist
      properties:
        CFBundleDisplayName: Howl
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSBluetoothAlwaysUsageDescription: Howl uses Bluetooth to discover and connect to compatible devices.
        NSBluetoothPeripheralUsageDescription: Howl uses Bluetooth to discover and connect to compatible devices.
        UIBackgroundModes:
          - bluetooth-central
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.amethystsysadmin.howl.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
